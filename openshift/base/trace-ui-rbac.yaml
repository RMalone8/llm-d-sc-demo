# Access for trace-ui to draw the live architecture diagram: it lists the predictor
# pods and reads each predictor Deployment's replica count. Namespace scoped, no
# access to secrets. The only write is scaling the traffic generator, pinned to
# that one Deployment by name, for the Simulate Traffic button.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trace-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trace-ui-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["praxis-traffic-gen"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trace-ui-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trace-ui-reader
subjects:
  - kind: ServiceAccount
    name: trace-ui

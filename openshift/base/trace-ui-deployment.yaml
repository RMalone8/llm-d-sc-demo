apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-ui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trace-ui
  template:
    metadata:
      labels:
        app: trace-ui
    spec:
      # Reads pod and Deployment state for the architecture diagram (see
      # trace-ui-rbac.yaml).
      serviceAccountName: trace-ui
      containers:
        - name: trace-ui
          image: quay.io/rmalone/praxis-trace-ui:v0.2.0
          env:
            - name: PRAXIS_UPSTREAM
              value: http://praxis:8080
            - name: CPU_UPSTREAM
              value: http://vllm-cpu-predictor:80
            - name: GPU_UPSTREAM
              value: http://vllm-gpu-predictor:80
            - name: TRACE_DB_PATH
              value: /data/traces.db
          ports:
            - name: http
              containerPort: 8080
            - name: cpu-backend
              containerPort: 8081
            - name: gpu-backend
              containerPort: 8082
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trace-ui-data

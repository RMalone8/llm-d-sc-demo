version: '3.8'

services:
  praxis:
    container_name: praxis
    image: quay.io/rmalone/praxis-llm-d-sc:v0.5.4
    ports:
      - "8080:8080"
    volumes:
      - ./praxis.yaml:/etc/praxis/config.yaml:ro,Z
    depends_on:
      - llm-d-sc
      - vllm-gpu
      - vllm-cpu

  llm-d-sc:
    container_name: llm-d-sc
    image: quay.io/rmalone/llm-d-sc:v0.1.0
    volumes:
      - ${LLM_D_SC_MODEL_DIR:?Set LLM_D_SC_MODEL_DIR to the host complexity ModelCar directory}:/models:ro,Z
    environment:
      LLM_D_SC_MODEL_DIR: /models
      LLM_D_SC_CLASSIFIER: complexity
      LLM_D_SC_LISTEN: "0.0.0.0:50051"

  vllm-gpu:
    container_name: vllm-gpu
    image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.1-1788369031
    ipc: host
    security_opt:
      - label=disable
    userns_mode: "keep-id:uid=1001"
    devices:
      - nvidia.com/gpu=all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: "0"
    volumes:
      - rhaii-cache:/opt/app-root/src/.cache:Z
    command:
      - "--model"
      - "Qwen/Qwen2.5-7B-Instruct"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.70"

  vllm-cpu:
    container_name: vllm-cpu
    image: registry.redhat.io/rhaii/vllm-cpu-rhel9:3.5.1-1788368981
    ipc: host
    security_opt:
      - label=disable
    userns_mode: "keep-id:uid=1001"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: "0"
      VLLM_CPU_KV_CACHE_SPACE: "8"
    volumes:
      - rhaii-cache:/opt/app-root/src/.cache:Z
    command:
      - "--model"
      - "Qwen/Qwen2.5-1.5B-Instruct"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.50"

volumes:
  rhaii-cache: